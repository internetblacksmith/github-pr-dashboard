name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: Lint
        run: npx eslint *.js

      - name: Test
        run: npm test

      - name: Build Chrome zip
        run: make build

      - name: Build Firefox xpi
        run: |
          # Directory names (not dir/*) so the xpi carries no empty folders;
          # **/*.svg drops the icon sources that ship only as PNG.
          npx --no-install web-ext build --source-dir=. --artifacts-dir=. \
            --ignore-files "node_modules" "test" "demo" "demo-build" "docs" ".github" \
            "**/*.svg" "package*.json" "eslint.config.*" "AGENTS.md" "CLAUDE.md" \
            "CHANGELOG.md" "PRIVACY.md" "README.md" ".gitignore" ".node-version" "Makefile"
          mv github_pr_dashboard-*.zip github-pr-dashboard-firefox-unsigned.xpi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            github-pr-dashboard-chrome.zip
            github-pr-dashboard-firefox-unsigned.xpi
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            | Browser | File | Notes |
            |---------|------|-------|
            | Chrome | `github-pr-dashboard-chrome.zip` | Unzip, then Load unpacked in `chrome://extensions` |
            | Firefox | `github-pr-dashboard-firefox-unsigned.xpi` | **Unsigned** — works as a temporary add-on only (removed on browser close). For a persistent install, use the signed version from [addons.mozilla.org](https://addons.mozilla.org) when available. |
